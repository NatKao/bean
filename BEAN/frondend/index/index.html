<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>埔里清新旅宿 | Puli Fresh Hotel</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
      body { background-color: #F9F9F9; }
      .fade-enter-active, .fade-leave-active { transition: opacity 0.5s ease; }
      .fade-enter-from, .fade-leave-to { opacity: 0; }
      .img-fade-enter-active, .img-fade-leave-active { transition: opacity 1s ease; }
      .img-fade-enter-from, .img-fade-leave-to { opacity: 0; }
      .img-fade-enter-to, .img-fade-leave-from { opacity: 1; }
      .accordion-enter-active, .accordion-leave-active { transition: all 0.3s ease; max-height: 500px; overflow: hidden; }
      .accordion-enter-from, .accordion-leave-to { max-height: 0; opacity: 0; padding: 0; }
      img[src=""] { display: none; }
      
      /* Calendar Styles 
      .calendar-day { @apply w-10 h-10 flex items-center justify-center rounded-full text-sm cursor-pointer transition-colors hover:bg-primary/20; }
      .calendar-day.selected { @apply bg-primary text-white hover:bg-primary; }
      .calendar-day.today { @apply border border-primary text-primary font-bold; }
      .calendar-day.disabled { @apply text-gray-300 cursor-not-allowed hover:bg-transparent; }*/
    </style>
  </head>
  <body class="text-gray-700 font-sans antialiased">
    <div id="app" class="flex flex-col min-h-screen"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
